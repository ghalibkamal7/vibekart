name = "vibekart-otp"
main = "src/index.ts"
compatibility_date = "2024-11-01"
keep_vars = true

[triggers]
crons = ["*/15 * * * *"]

# Created by `wrangler kv namespace create OTP_KV` — paste the printed id
# below. This id is not a secret (it's just an identifier), but it is
# specific to your Cloudflare account, so there's no default value here.
[[kv_namespaces]]
binding = "OTP_KV"
id = "629e174b698047339ed0ee471691c973"

# Phone OTP and MSG91 are currently disabled/future-only. Do not configure
# MSG91 for current Worker functionality; see README.md before reactivation.
[vars]
MERCHANT_NAME = "VibeKart"
MERCHANT_MCC = "5399"
GPAY_ENV = "TEST"

# Secrets required for production:
# - FIREBASE_SERVICE_ACCOUNT_JSON (`wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON`)
# - MERCHANT_VPA (`wrangler secret put MERCHANT_VPA`) - Registered merchant UPI VPA
# - BANK_PSP_API_URL (`wrangler secret put BANK_PSP_API_URL`) - Bank UPI status inquiry endpoint
# - BANK_PSP_API_KEY (`wrangler secret put BANK_PSP_API_KEY`) - Bank authorization token
# - BANK_PSP_MERCHANT_ID (`wrangler secret put BANK_PSP_MERCHANT_ID`) - Acquiring bank merchant ID
# - CLOUDINARY_CLOUD_NAME (`wrangler secret put CLOUDINARY_CLOUD_NAME`)
# - CLOUDINARY_API_KEY (`wrangler secret put CLOUDINARY_API_KEY`)
# - CLOUDINARY_API_SECRET (`wrangler secret put CLOUDINARY_API_SECRET`) - Server-only signed upload and cleanup credential
# Future-only phone OTP settings (not required by current routes):
# - MSG91_AUTH_KEY
# - MSG91_TEMPLATE_ID (non-secret MSG91 template identifier)